name: Build Zeta Board APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace -PverCode=${{ github.run_number }} -PgithubRepo=${{ github.repository }}
      - name: Publish release (used by in-app updater)
        env:
          GH_TOKEN: ${{ github.token }}
          VC: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ZetaBoard.apk
          python3 - <<'PY'
          import json, os
          vc = int(os.environ["VC"])
          repo = os.environ["REPO"]
          notes = open("CHANGELOG.txt", encoding="utf-8").read().strip()
          data = {
              "versionCode": vc,
              "versionName": "1.0." + str(vc),
              "notes": notes,
              "apkUrl": "https://github.com/" + repo + "/releases/download/v" + str(vc) + "/ZetaBoard.apk",
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False)
          PY
          gh release create "v$VC" ZetaBoard.apk update.json --title "Zeta Board 1.0.$VC" --notes-file CHANGELOG.txt --target "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: ZetaBoard-APK
          path: ZetaBoard.apk
